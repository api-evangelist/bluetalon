aid: bluetalon
name: Bluetalon
description: >-
  BlueTalon was a data-centric security company founded in 2013 and headquartered
  in Redwood City, California, that provided centralized data access control, dynamic
  data masking, and policy enforcement across big-data and hybrid data environments
  (Hadoop, Spark, relational databases, and cloud data stores). Its platform let
  enterprises define and enforce fine-grained authorization, auditing, and data-
  protection policies from a single control point. BlueTalon was backed by DCVC
  (Data Collective) among other investors, and was acquired by Microsoft in 2019,
  with its technology folded into Microsoft's Azure data-governance and security
  portfolio. The company no longer operates independently: bluetalon.com is no
  longer resolvable and the GitHub organization retains only archived, deprecated
  repositories. This profile is retained as a network record of an acquired
  provider; there is no live public API surface to enrich.
